# Herhangi bir tanımlı domain eşleşmezse bağlantıyı düşür (güvenlik için)
server {
    listen 80 default_server;
    server_name _;
    return 444; # Bağlantıyı yanıt vermeden kapat
}

server {
    listen 80;
    # Sadece kendi domainimizden gelen isteklere yanıt ver
    server_name quizstrike.com.tr *.quizstrike.com.tr localhost frontend arena-frontend-prod;

    root /usr/share/nginx/html;
    index index.html;

    # SPA (Single Page Application) için tüm istekleri index.html'e yönlendiriyoruz
    location / {
        try_files $uri $uri/ /index.html;
    }

    # HTML dosyaları için cache'i devre dışı bırak
    location ~* \.(html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Statik dosyalar için uzun süreli önbellekleme (Cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip sıkıştırmasını aktif edebiliriz (büyük Vite JS bundle'ları için faydalıdır)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json text/javascript application/x-javascript application/javascript application/xml;
}
